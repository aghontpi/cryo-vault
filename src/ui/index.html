<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CryoVault</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo">C</span><strong>CryoVault</strong>
      </div>
      <div id="stats" class="muted" aria-live="polite">Loading archive…</div>
    </header>
    <main>
      <aside>
        <div class="list-heading">
          <h1>Conversations</h1>
          <button
            id="refresh"
            class="text-button"
            aria-label="Refresh conversations"
          >
            Refresh
          </button>
        </div>
        <label class="sr-only" for="query">Search all conversations</label
        ><input
          id="query"
          type="search"
          placeholder="Search conversations"
          autocomplete="off"
        />
        <div class="filters">
          <label
            >Source<select id="source">
              <option value="">All sources</option>
            </select></label
          ><label>From (UTC)<input id="after" type="date" /></label
          ><label>To (UTC)<input id="before" type="date" /></label>
        </div>
        <div class="list-label">
          <span>RECENT</span><span id="count"></span>
        </div>
        <div id="list" aria-live="polite">
          <p class="notice">Loading conversations…</p>
        </div>
        <button id="more" hidden>Load more</button>
      </aside>
      <section class="reader">
        <div id="empty" class="empty">
          <span class="logo large">C</span>
          <h2>Your conversations, in one place.</h2>
          <p>Choose a conversation to start reading.</p>
        </div>
        <article id="conversation" hidden>
          <div class="reader-top">
            <span id="breadcrumb" class="eyebrow"></span>
            <div class="actions">
              <button id="find-toggle">Find in conversation</button
              ><button id="details-toggle">Details</button>
            </div>
          </div>
          <div id="find-panel" class="find-panel" hidden>
            <label class="sr-only" for="find">Find in conversation</label
            ><input
              id="find"
              type="search"
              placeholder="Find in this conversation"
            /><span id="find-count" class="muted"></span
            ><button id="previous" aria-label="Previous match">↑</button
            ><button id="next" aria-label="Next match">↓</button>
          </div>
          <h2 id="title"></h2>
          <p id="subtitle" class="muted"></p>
          <div id="details" class="details" hidden></div>
          <div id="messages"></div>
        </article>
      </section>
    </main>
  </body>
</html>
